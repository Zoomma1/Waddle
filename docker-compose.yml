services:
  waddle-fleet:
    build: .
    image: waddle-fleet
    container_name: waddle-fleet
    stop_grace_period: 30s
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - PUSH_INTERVAL_H=6
      - PYTHONUNBUFFERED=1
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs

  # Dashboard lecture seule, joignable uniquement sur l'IP Tailscale du N100 (DASH_BIND ci-dessous, prime sur .env).
  waddle-dashboard:
    image: waddle-fleet
    container_name: waddle-dashboard
    restart: unless-stopped
    network_mode: host
    entrypoint: ["uv", "run", "scripts/dashboard.py"]
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DASH_BIND=100.75.56.107
    volumes:
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      - ./data:/app/data
